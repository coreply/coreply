plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.coreply.coreplymodule'
version = '0.1.0'

android {
  namespace "app.coreply.coreplymodule"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0")
}
